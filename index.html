<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#f7a8bd" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Dango" />
  <meta name="format-detection" content="telephone=no" />
  <title>Dango — Room Layout Planner</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon/apple-touch-icon.png" />
  <link rel="icon" href="icon/favicon-32.png" sizes="32x32" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="brand">
        <img src="icon/icon-192.png" alt="" class="brand-icon" />
        <div class="brand-copy">
          <div class="brand-title">Dango</div>
          <div class="brand-subtitle" id="projectSubtitle">Room Layout Planner</div>
        </div>
      </div>
      <div class="topbar-actions" id="editorHistoryActions">
        <button class="icon-btn" id="undoBtn" aria-label="Undo" title="Undo">↶</button>
        <button class="icon-btn" id="redoBtn" aria-label="Redo" title="Redo">↷</button>
      </div>
    </header>

    <main class="main">
      <section id="roomsView" class="view active">
        <div class="rooms-topline">
          <div>
            <span class="eyebrow">🍡 Room planner</span>
            <h1>My rooms</h1>
            <p id="roomCountLabel">0 saved rooms</p>
          </div>
          <button class="primary-btn compact-primary" id="newRoomHeroBtn">＋ New room</button>
        </div>

        <div class="room-filter-row">
          <div class="segmented compact" id="roomFilter">
            <button data-filter="all" class="active">All</button>
            <button data-filter="starred">Starred</button>
          </div>
        </div>
        <div id="roomsGrid" class="rooms-grid"></div>
      </section>

      <section id="planView" class="view planner-view">
        <div class="planner-toolbar" aria-label="Quick planning tools">
          <button class="tool-btn" data-tool="select" aria-pressed="true">✋<span>Select</span></button>
          <button class="tool-btn" data-action="quickAdd">＋<span>Add</span></button>
          <button class="tool-btn" data-action="measure">📏<span>Measure</span></button>
          <button class="tool-btn" data-action="insights">✨<span>Fit</span></button>
          <button class="tool-btn" data-action="layers">▱<span>View</span></button>
        </div>

        <div class="canvas-wrap" id="canvasWrap">
          <div class="zoom-stack">
            <button id="zoomInBtn" class="mini-btn" aria-label="Zoom in">＋</button>
            <button id="fitBtn" class="mini-btn" aria-label="Fit room">⌂</button>
            <button id="zoomOutBtn" class="mini-btn" aria-label="Zoom out">−</button>
          </div>
          <div class="status-stack">
            <div class="status-pill" id="saveStatus">Saved</div>
            <button class="status-pill tappable" id="fitStatus" type="button">Fit —</button>
            <button class="status-pill tappable issue-status" id="issuesStatus" type="button">0 issues</button>
          </div>
          <svg id="planCanvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Room plan"></svg>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="rooms" class="active">🏠<span>Rooms</span></button>
      <button data-view="plan">📐<span>Plan</span></button>
      <button id="quickAddBtn" class="nav-add" aria-label="Add">＋</button>
      <button data-action="layoutsNav">🗂️<span>Layouts</span></button>
    </nav>
  </div>

  <div id="drawerBackdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-head">
      <div class="brand"><img src="icon/icon-192.png" class="brand-icon" alt=""><div><b>Dango</b><small>Room Layout Planner</small></div></div>
      <button class="icon-btn" id="closeDrawerBtn" aria-label="Close menu">×</button>
    </div>

    <div class="drawer-scroll">
      <div class="drawer-section">
        <div class="drawer-label">Plan</div>
        <button data-drawer-action="rooms">🏠 <span>Rooms</span></button>
        <button data-drawer-action="newRoom">＋ <span>New room</span></button>
        <button data-drawer-action="plan">📐 <span>Current plan</span></button>
        <button data-drawer-action="layouts">🗂️ <span>Layouts</span></button>
        <button data-drawer-action="templates">🧩 <span>Room templates</span></button>
        <button data-drawer-action="roomShape">📐 <span>Walls & room shape</span></button>
      </div>

      <div class="drawer-section current-room-only">
        <div class="drawer-label">Add & arrange</div>
        <button data-drawer-action="quickAdd">＋ <span>Quick add</span></button>
        <button data-drawer-action="objects">🪑 <span>Furniture & objects</span></button>
        <button data-drawer-action="openings">🚪 <span>Doors, windows & fixtures</span></button>
        <button data-drawer-action="zones">▧ <span>Planning zones</span></button>
        <button data-drawer-action="measure">📏 <span>Measure</span></button>
        <button data-drawer-action="layers">▱ <span>Layers & display</span></button>
      </div>

      <div class="drawer-section current-room-only">
        <div class="drawer-label">Check & decide</div>
        <button data-drawer-action="insights">✨ <span>Space insights & fit tools</span></button>
        <button data-drawer-action="oneImprovement">💡 <span>One improvement</span></button>
        <button data-drawer-action="walkingPath">👣 <span>Walking path check</span></button>
        <button data-drawer-action="issues">⚠️ <span>Issues & clearances</span></button>
        <button data-drawer-action="readiness">✅ <span>Ready-to-move checklist</span></button>
        <button data-drawer-action="shopping">🛒 <span>Shopping list</span></button>
        <button data-drawer-action="remeasure">📐 <span>Re-measure list</span></button>
        <button data-drawer-action="notes">📝 <span>Room & layout notes</span></button>
      </div>

      <div class="drawer-section current-room-only">
        <div class="drawer-label">Project</div>
        <button data-drawer-action="roomSettings">🏠 <span>Room settings</span></button>
        <button data-drawer-action="preview">👁️ <span>Clean preview</span></button>
        <button data-drawer-action="export">↗ <span>Export</span></button>
      </div>

      <div class="drawer-section">
        <div class="drawer-label">Dango</div>
        <button data-drawer-action="wholeHome">🏡 <span>Whole home</span></button>
        <button data-drawer-action="moving">📦 <span>Moving mode</span></button>
        <button data-drawer-action="backup">💾 <span>Backup & restore</span></button>
        <button data-drawer-action="storage">🧰 <span>Storage health</span></button>
        <button data-drawer-action="settings">⚙️ <span>Settings</span></button>
        <button data-drawer-action="about">🍡 <span>About Dango</span></button>
      </div>
    </div>
  </aside>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" aria-live="polite"></div>

  <template id="modalTemplate">
    <div class="modal-backdrop">
      <section class="modal-sheet" role="dialog" aria-modal="true">
        <header class="modal-head"><h3></h3><button class="icon-btn modal-close" aria-label="Close">×</button></header>
        <div class="modal-body"></div>
      </section>
    </div>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
